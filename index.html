<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHSHI</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f7f9" />
    <meta
      name="description"
      content="Turn the AI subscriptions you already pay for into a chat workspace and an OpenAI compatible API. Connect an account and every call runs on that plan, with live remaining quota."
    />
    <meta property="og:title" content="Ohshi — one subscription, chat and API" />
    <meta
      property="og:description"
      content="Chat and an OpenAI compatible API on the AI subscriptions you already pay for. No API credits to buy."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ohshi.space/" />
    <script>
      // Paint the right theme before React mounts — no flash of the wrong one.
      (function () {
        try {
          // Light is the default; dark is opt-in through the toggle, so the
          // OS preference is deliberately not consulted.
          var t = localStorage.getItem("ohshi.theme");
          if (t !== "light" && t !== "dark") t = "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: #f7f7f9; }
      html[data-theme="dark"] { background: #0a0c10; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
