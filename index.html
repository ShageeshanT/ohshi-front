<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ohshi — your Google account, every frontier model</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Chat with Gemini, Claude and GPT-OSS and give your agents an OpenAI-compatible API — on the Google account you already have, with live remaining quota."
    />
    <meta property="og:title" content="Ohshi — your Google account, every frontier model" />
    <meta
      property="og:description"
      content="Chat with Gemini, Claude and GPT-OSS, and give your agents an OpenAI-compatible API — all on the Google account you already have."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ohshi.space/" />
    <script>
      // Paint the right theme before React mounts — no flash of the wrong one.
      (function () {
        try {
          var t = localStorage.getItem("ohshi.theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: #f7f7f9; }
      html[data-theme="dark"] { background: #0a0c10; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
